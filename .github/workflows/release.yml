name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Build and package release
        run: bash scripts/package-release.sh "$RUNNER_TEMP/EdgeBeat.zip"

      - name: Verify release archive
        run: |
          ditto -x -k "$RUNNER_TEMP/EdgeBeat.zip" "$RUNNER_TEMP/extracted"
          codesign --verify --deep --strict "$RUNNER_TEMP/extracted/EdgeBeat.app"
          plutil -lint "$RUNNER_TEMP/extracted/EdgeBeat.app/Contents/Info.plist"

      - name: Publish GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" "$RUNNER_TEMP/EdgeBeat.zip" --clobber
